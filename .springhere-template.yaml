schema_version: 1
component: backend
cli_constraint: ">=0.1.0 <1.0.0"
payload:
  include:
    - cmd
    - internal
    - pkg
    - deploy
    - docs
    - application.yaml
    - Dockerfile
    - .dockerignore
    - .env.example
    - .gitignore
    - Makefile
    - go.mod
    - go.sum
    - README.md
    - AGENTS.md
    - LICENSE
transforms:
  - kind: go_module
    value_from: backend_module
  - kind: deploy_stack
    path: deploy
    from: springhere
    value_from: project_name
